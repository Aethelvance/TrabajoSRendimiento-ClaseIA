services:
  diagrams:
    build: ./diagrams
    # Forma corta Dokploy: solo puerto de contenedor, sin bindear host.
    # En Dokploy el acceso va por dominios (Traefik). En local: `docker compose port diagrams 8080`.
    ports:
      - "8080"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    ports:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
    ports:
      - "80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
